<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8" />
<title>RxChef — أسئلة شائعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#F6F5F1; color:#16221F; font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#348F80; text-decoration:none; }
  a:hover { color:#D89A83; }
</style>
</helmet>
<div dir="rtl" style="min-height:100vh; padding:0 clamp(20px,7vw,110px) 96px; box-sizing:border-box; background:radial-gradient(64% 42% at 78% 4%, rgba(52,143,128,.10), transparent 70%), radial-gradient(52% 38% at 10% 92%, rgba(216,154,131,.13), transparent 72%), linear-gradient(165deg,#F4F6F3,#F6F5F1 46%,#F8F1EC)">

  <header style="position:sticky; top:16px; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:12px 22px 12px 26px; max-width:900px; margin:22px auto 0; box-sizing:border-box; background:linear-gradient(100deg, rgba(255,254,251,.82), rgba(244,246,243,.78)); backdrop-filter:blur(14px) saturate(1.1); -webkit-backdrop-filter:blur(14px) saturate(1.1); border:1px solid rgba(52,143,128,.16); border-radius:20px; box-shadow:0 12px 30px -22px rgba(9,72,61,.4)">
    <a href="./RxChef Home.dc.html" style="display:flex; align-items:center"><img src="uploads/logo%20RxChef.jpg" alt="RxChef" style="height:38px; width:auto; mix-blend-mode:multiply" /></a>
    <nav style="display:flex; align-items:center; gap:clamp(12px,1.9vw,26px); font-size:14.5px; justify-content:flex-end; white-space:nowrap">
      <a href="./RxChef Tool.dc.html" style="color:#09483D">الأداة</a>
      <a href="./RxChef How It Works.dc.html" style="color:#09483D">كيف يعمل</a>
      <a href="./RxChef About.dc.html" style="color:#09483D">عن المشروع</a>
      <a href="./RxChef FAQ.dc.html" style="color:#348F80">أسئلة شائعة</a>
      <a href="./RxChef Contact.dc.html" style="color:#09483D">تواصل</a>
    </nav>
  </header>

  <main style="max-width:820px; margin:0 auto">

    <section style="padding:clamp(44px,9vh,88px) 0 clamp(28px,4vh,44px)">
      <p style="margin:0 0 14px; font-size:13px; letter-spacing:.1em; color:#AFB8B5">أسئلة شائعة</p>
      <h1 style="margin:0; font-size:clamp(30px,3.6vw,44px); line-height:1.32; font-weight:600; color:#09483D; letter-spacing:-.01em; max-width:22ch; text-wrap:pretty">ما تفعله الأداة، وما لا تفعله</h1>
    </section>

    <section style="display:grid; gap:10px">
      <sc-for list="{{ items }}" as="q" hint-placeholder-count="8">
        <div style="background:#FFFEFB; border:1px solid rgba(175,184,181,.42); border-radius:20px; overflow:hidden; box-shadow:0 20px 46px -38px rgba(9,72,61,.32)">
          <div role="button" onClick="{{ q.toggle }}" style="display:flex; align-items:center; gap:16px; padding:20px 24px; cursor:pointer">
            <span style="flex:1; font-size:17px; font-weight:500; line-height:1.6; color:#09483D">{{ q.question }}</span>
            <span style="font-family:Outfit,sans-serif; font-size:19px; color:#348F80; width:16px; text-align:center">{{ q.caret }}</span>
          </div>
          <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0; padding:0 24px 22px; font-size:16px; line-height:1.95; color:#16221F; opacity:.78; text-wrap:pretty">{{ q.answer }}</p>
          </sc-if>
        </div>
      </sc-for>
    </section>

    <section style="margin-top:clamp(40px,6vh,64px); padding-top:clamp(30px,4vh,46px); border-top:1px solid rgba(175,184,181,.4); display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap">
      <p style="margin:0; font-size:16px; color:#16221F; opacity:.76">سؤال غير موجود هنا؟</p>
      <a href="./RxChef Contact.dc.html" style="font-size:15px">اكتب لنا ←</a>
    </section>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const QA = [
  { q: "كم دواء في قاعدة بياناتكم؟",
    a: "القاعدة الحالية أوليّة وتغطّي الأدوية الأكثر صرفًا في الأمراض المزمنة والمضادات الحيوية الشائعة، لا كل ما هو مسجّل في السوق. أي اسم خارجها يظهر في الوصفة موسومًا «غير موجود بقاعدة بياناتنا الحالية» ويُستثنى من فحص التفاعلات — لا نخفي النقص ولا نخمّن مكانه. التوسيع يجري بالتغذية الراجعة من الأطباء والصيادلة الذين يجرّبون الأداة." },
  { q: "هل الأداة تحلّ محلّ قرار الطبيب؟",
    a: "لا. الأداة دعم قرار: تعرض ما فحصته، وتشرح سبب كل اقتراح، وتترك الاختيار للطبيب أو الصيدلي الذي يعرف المريض وتاريخه. لا تكتب وصفة، ولا تعتمد صرفًا، ولا تُلزِم بشيء. البديل الذي تُرتّبه أولًا قد يكون خطأً لهذا المريض تحديدًا لسبب لا تعرفه الأداة — لذلك تُعرض المرشّحات كلها مع سبب موضع كل واحد." },
  { q: "هل تقترحون جرعات؟",
    a: "لا نبتدئ جرعة جديدة ولا نعدّل جرعة قائمة. البدائل تُعرض بجرعة مكافئة للجرعة الموجودة في الوصفة عند وجود تكافؤ معروف، وإن كان البديل يحتاج ضبط جرعة نقول ذلك صريحًا في جملة السبب ونتركه للطبيب." },
  { q: "من أين تأتي معلومات التفاعلات؟",
    a: "من مراجع التفاعلات الدوائية المنشورة، مصاغة في قواعد صريحة قابلة للعرض. كل تنبيه في التقرير يمكن فتحه في صفحة تفاصيل التحليل لرؤية القاعدة التي أطلقته ودرجة شدّتها. إن اختلف مرجع عن آخر في تقدير الشدة، نأخذ الأشد ونذكر ذلك." },
  { q: "من أين تعرفون أن الدواء غير متوفّر؟",
    a: "التوفّر مأخوذ من مخزون الصيدليات المشاركة في نطاق المريض، مع تاريخ آخر تحديث ظاهر في التقرير. هذه بيانات ناقصة بطبيعتها: صيدلية غير مشاركة قد يكون عندها الدواء. لذلك نعرض عدد الصيدليات المفحوصة، لا حكمًا مطلقًا بالانقطاع." },
  { q: "لماذا تقبلون الإملاء الخاطئ؟ أليس ذلك خطرًا؟",
    a: "الخطر الأكبر أن يستسلم المستخدم للأداة ويكتب الوصفة على ورق. المطابقة الضبابية تقترح ولا تثبّت: أي تطابق تحت 90% يُعرض للتأكيد قبل أن يدخل في الفحص، وكل اسم مثبَّت يظهر في التقرير بصيغته الكاملة مع الجرعة حتى يكون التحقّق البصري ممكنًا." },
  { q: "ماذا يحدث لبيانات الوصفة التي أدخلها؟",
    a: "التحليل يجري على الوصفة كمدخل مؤقّت، ولا نطلب اسم مريض ولا رقمًا يعرّفه. النسخة الحالية نموذج بحثي، فلا تُدخل بيانات تعريفية للمريض فيه إطلاقًا." },
  { q: "هل يعمل مع الأسماء التجارية أم العلمية؟",
    a: "الاثنان، بحسب ما هو مسجّل في القاعدة. الاسم التجاري يُطابق مادته الفعّالة، والفحص يجري على المادة لا على العلبة — لذلك يظهر التفاعل حتى لو كتب الطبيب اسمين تجاريين مختلفين لنفس المادة." },
  { q: "هل هو مشروح للمريض أم للطبيب؟",
    a: "التقرير موجّه للطبيب والصيدلي، لكن جمل الشرح مكتوبة بلغة تصلح للقراءة أمام المريض. لذلك هناك نسختان للطباعة: نسخة مختصرة للمريض، ونسخة كاملة تُظهر كل الخطوات ودرجات الثقة." }
];

class Component extends DCLogic {
  state = { open: [0] };
  toggle(i) {
    this.setState(s => ({ open: s.open.includes(i) ? s.open.filter(x => x !== i) : s.open.concat([i]) }));
  }
  renderVals() {
    return {
      items: QA.map((x, i) => ({
        question: x.q, answer: x.a,
        open: this.state.open.includes(i),
        caret: this.state.open.includes(i) ? "−" : "+",
        toggle: () => this.toggle(i)
      }))
    };
  }
}
</script>
</body>
</html>
